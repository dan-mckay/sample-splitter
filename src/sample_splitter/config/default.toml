[splitter]
threshold_db = 20.0
min_gap_ms = 300
min_sample_ms = 100
head_pad_ms = 10
tail_pad_ms = 50

[analysis]
window_ms = 10.0
montage_floor_db = -55.0
montage_min_duration_s = 30.0
montage_max_gap_count = 1
expected_min_segments = 5
expected_max_segments = 15
mismatch_tolerance = 0

[splitter.overrides."83 Electribe 101.flac"]
# This file has ~3.9s of bit-exact digital silence at its tail — much
# quieter than its real between-hit gaps (~-105 dBFS, same as every other
# track on this disc). The 10th-percentile floor estimator locks onto that
# trailing silence instead, giving a ~-280 dBFS floor and a "quiet" cutoff so
# low that all 20 real hits merge into one blob. A much higher threshold_db
# compensates: (-280 + 200) = -80 dBFS sits between the real gaps (~-105,
# correctly quiet) and the quietest hit (~-53, correctly loud). Verified
# against the file directly — correctly finds 20 short (0.13-0.34s) hits,
# consistent with the owner's identification of this track as a series of
# Electribe 101 drum machine one-shots.
threshold_db = 200.0

[naming]
review_threshold = 0.5
backend = "stub"

[taxonomy]
drums = ["kick", "snare", "hat", "tom", "cymbal", "perc"]
bass = ["sub", "synth", "picked"]
synth = ["stab", "pad", "lead"]
keys = ["piano", "organ", "ep"]
guitar = ["chord", "riff", "note"]
strings = ["stab", "sustain"]
vocal = ["phrase", "shout", "spoken"]
fx = ["riser", "impact", "noise", "ambience"]
beats = ["loop", "break", "fill"]
