[splitter]
threshold_db = 20.0
min_gap_ms = 300
min_sample_ms = 100
head_pad_ms = 10
tail_pad_ms = 50

[analysis]
window_ms = 10.0
montage_floor_db = -55.0
montage_min_duration_s = 30.0
montage_max_gap_count = 1
expected_min_segments = 5
expected_max_segments = 15
mismatch_tolerance = 0

[splitter.overrides."83 Electribe 101.flac"]
# This file has ~3.9s of bit-exact digital silence at its tail — much
# quieter than its real between-hit gaps (~-105 dBFS, same as every other
# track on this disc). The 10th-percentile floor estimator locks onto that
# trailing silence instead, giving a ~-280 dBFS floor and a "quiet" cutoff so
# low that all 20 real hits merge into one blob. A much higher threshold_db
# compensates: (-280 + 200) = -80 dBFS sits between the real gaps (~-105,
# correctly quiet) and the quietest hit (~-53, correctly loud). Verified
# against the file directly — correctly finds 20 short (0.13-0.34s) hits,
# consistent with the owner's identification of this track as a series of
# Electribe 101 drum machine one-shots.
threshold_db = 200.0

[naming]
review_threshold = 0.5
backend = "stub"

# Subtype text doubles as the CLAP classification prompt (see classifier.py)
# and the output folder/filename — spell out abbreviations that read poorly
# as a bare word ("ep", "hat", "perc", "sub", "break") rather than keeping a
# separate short-name/prompt-text mapping in sync. Verified against a real
# misclassification during the acceptance run (#9): "ep" alone scored 0.631
# on a sample that was actually a drum break; "electric piano" scored the
# same sample's correct label ("drum break") at 0.710.
#
# "clap" and the "brass" category were added after cross-referencing the
# General MIDI percussion key map and the NSynth/AudioSet instrument-family
# taxonomies against gaps in the original list, then validating each against
# real samples from the library: adding "clap" pulled 4 of 11 previously
# "snare"-classified Electribe 101 hits over to the correct label (3 of them
# at 0.94+ confidence); adding "brass" correctly reclassified 3 known brass
# samples (Funky Element track 54, samples 05-07) that had previously been
# forced into wrong labels (vocal/shout, synth/stab, synth/lead) at
# mediocre confidence.
#
# Full-library review from the owner (#9) surfaced three more findings:
# - "bell" was a missing category: electric_piano/organ/piano were all
#   catching bell/chime content instead. Validated against 6 real review
#   samples from keys/electric_piano — 5 of 6 correctly moved to bell/*.
# - loop/drum_break/fill were collapsed to a single "loop" subtype — the
#   owner found the three indistinguishable by ear in this library.
# - vocal/spoken was merged into vocal/phrase for the same reason.
[taxonomy]
drums = ["kick", "snare", "hi-hat", "tom", "cymbal", "percussion", "clap"]
bass = ["sub bass", "synth", "picked"]
synth = ["stab", "pad", "lead"]
keys = ["piano", "organ", "electric piano"]
guitar = ["chord", "riff", "note"]
strings = ["stab", "sustain"]
vocal = ["phrase", "shout"]
fx = ["riser", "impact", "noise", "ambience"]
beats = ["loop"]
brass = ["stab", "hit"]
bell = ["bell", "chime"]
